version: 2
updates:
  # Server dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "adityaprakash"
    assignees:
      - "adityaprakash"
    labels:
      - "dependencies"
      - "server"
    commit-message:
      prefix: "chore(server)"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"

  # Client dependencies
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "adityaprakash"
    assignees:
      - "adityaprakash"
    labels:
      - "dependencies"
      - "client"
    commit-message:
      prefix: "chore(client)"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    reviewers:
      - "adityaprakash"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
