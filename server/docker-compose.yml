version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatlockup
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: chatlockup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatlockup"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      DATABASE_URL: postgresql://chatlockup:dev_password@postgres:5432/chatlockup
      JWT_SECRET: dev-secret-key-change-in-production
      PORT: 3001
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
